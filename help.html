<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ศูนย์ช่วยเหลือและนโยบาย | ร้านหนังสือมือสอง</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/tailwind.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#FAF7F2] text-[#1F4E4B]">
  <div id="site-header">
    <header class="sticky top-0 z-50 bg-[#FAF7F2]/95 backdrop-blur-md border-b border-[#E6E1D6]">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
        <a href="index.html" id="navbar-logo-link" data-nav-home="true" onclick="if(window.navigateToHome) return window.navigateToHome(event);" class="flex items-center gap-2 font-extrabold text-base sm:text-lg text-[#1F4E4B] hover:text-[#26A69A] transition cursor-pointer">
          <span class="w-8 h-8 rounded-xl bg-[#E0F4F1] text-[#26A69A] flex items-center justify-center">📚</span>
          <span>ร้านหนังสือมือสอง</span>
        </a>
        <div class="flex items-center gap-2 sm:gap-3">
          <a href="index.html" id="navbar-home-link" data-nav-home="true" onclick="if(window.navigateToHome) return window.navigateToHome(event);" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-[#1F4E4B] hover:bg-[#E0F4F1]/60 hover:text-[#26A69A] text-xs sm:text-sm font-bold transition cursor-pointer">
            <span>หน้าแรก</span>
          </a>
          <a href="login.html" class="inline-flex items-center gap-1.5 px-3.5 sm:px-4 py-2 rounded-full bg-[#26A69A] hover:bg-[#219187] text-white text-xs sm:text-sm font-extrabold shadow-xs transition">
            <span>👤</span>
            <span>เข้าสู่ระบบ<span class="hidden sm:inline"> / สมัครสมาชิก</span></span>
          </a>
        </div>
      </div>
    </header>
  </div>

  <main class="flex-1 py-8 sm:py-12 px-4 sm:px-6">
    <div class="max-w-4xl mx-auto">
      <p class="mb-5 rounded-2xl bg-[#FDF2E2] border border-[#E9964A] px-4 py-3 text-xs font-bold">🧪 ระบบอยู่ระหว่างทดสอบ — นโยบายด้านล่างเป็นฉบับร่างก่อนเปิดใช้งานจริง และอาจปรับเปลี่ยนได้</p>
      <h1 class="text-2xl sm:text-3xl font-extrabold">ศูนย์ช่วยเหลือและนโยบาย</h1>
      <nav id="help-tabs" class="mt-5 flex flex-wrap gap-2 text-xs sm:text-sm font-bold" role="tablist"></nav>

      <section id="help-body" class="mt-6 bg-white rounded-3xl border border-[#E6E1D6] p-6 sm:p-9 shadow-2xs leading-relaxed text-sm"></section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/books-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const H = (t) => `<h2 class="text-lg font-extrabold mt-7 mb-2 first:mt-0">${t}</h2>`;
    const P = (t) => `<p class="text-[#3d5a56] mb-2">${t}</p>`;
    const UL = (a) => `<ul class="list-disc pl-5 space-y-1 mb-2 text-[#3d5a56]">${a.map(x => `<li>${x}</li>`).join('')}</ul>`;
    const Q = (q, a) => `<details class="group border-b border-[#E6E1D6] py-3"><summary class="cursor-pointer font-bold">${q}</summary><div class="mt-2 text-[#3d5a56]">${a}</div></details>`;

    const PAGES = {
      faq: ['คำถามที่พบบ่อย', () =>
        Q('ระบบบัญชีกลาง (Escrow) คืออะไร', 'ผู้ซื้อโอนเงินเข้าบัญชีกลางของร้านก่อน ผู้ขายส่งหนังสือ เมื่อผู้ซื้อได้รับของและยืนยัน เราจึงโอนเงินให้ผู้ขาย ช่วยให้ไม่โดนโกงทั้งสองฝ่าย') +
        Q('ซื้อหนังสือต้องทำอย่างไร', UL(['เข้าสู่ระบบและยืนยันเบอร์โทรด้วย OTP', 'เลือกหนังสือแล้วกดสั่งซื้อ กรอกที่อยู่จัดส่ง', 'โอนเงินเข้าบัญชีกลางตามขั้นตอนชำระเงิน', 'รอผู้ขายส่งของ แล้วกดยืนยันเมื่อได้รับ'])) +
        Q('ลงขายหนังสือต้องทำอย่างไร', 'สมัครสมาชิก กด "+ ลงขายหนังสือ" ใส่ภาพถ่ายจริง ราคา และสภาพหนังสือตามเกณฑ์ เมื่อมีคนสั่งซื้อต้องส่งของภายใน 48 ชั่วโมง พร้อมรูปก่อนแพ็กและใบเสร็จขนส่ง') +
        Q('ทำไมต้องใส่บัญชีธนาคาร', 'ใช้สำหรับโอนเงินให้ผู้ขายเมื่อขายสำเร็จ และคืนเงินให้ผู้ซื้อเมื่อมีการยกเลิกหรือคืนสินค้า ไม่บังคับตอนสมัคร เลขบัญชีเก็บแบบเข้ารหัส') +
        Q('ได้ของไม่ตรงปกต้องทำอย่างไร', 'แจ้งปัญหาในหน้า "ฝั่งซื้อของฉัน" พร้อมแนบวิดีโอแกะพัสดุแบบไม่ตัดต่อและรูปจุดที่มีปัญหา เงินจะถูกพักไว้จนกว่าแอดมินตัดสิน อ่านรายละเอียดที่หัวข้อ "นโยบายคืนเงิน"') +
        Q('โอนเงินให้ผู้ขายตรงๆ ได้ไหม', 'ไม่ควร การโอนนอกระบบไม่ได้รับความคุ้มครองจากบัญชีกลาง และการแลกเปลี่ยนช่องทางติดต่อภายนอกผิดกติกา') +
        Q('ติดต่อทีมงานได้ที่ไหน', 'ที่หน้า <a class="font-bold text-[#26A69A] underline" href="contact.html">ติดต่อเรา</a>')],
      fees: ['ค่าธรรมเนียมและการชำระเงิน', () =>
        H('ผู้ซื้อ') + UL(['ค่าบริการดูแลบัญชีกลาง <b>5 บาท + 5% ของราคาหนังสือ</b> ปัดเป็นจำนวนเต็ม ขั้นต่ำ 5 บาท สูงสุดไม่เกิน 30 บาทต่อเล่ม', 'ตัวอย่าง: หนังสือ 200 บาท ค่าบริการ 15 บาท (5 + 10)', 'ค่าจัดส่งเป็นไปตามที่ผู้ขายระบุในประกาศ']) +
        H('ผู้ขาย') + UL(['ลงขายฟรี ไม่มีค่าธรรมเนียมจากผู้ขาย', 'ได้รับเงินเต็มจำนวนราคาหนังสือบวกค่าจัดส่งเมื่อผู้ซื้อยืนยันรับของ']) +
        H('การชำระเงิน') + P('ชำระผ่านบัญชีกลางของร้านตามขั้นตอนในหน้าชำระเงิน ภายในเวลาที่กำหนด ช่องทางชำระและรอบโอนเงินให้ผู้ขายจะประกาศชัดเจนก่อนเปิดใช้งานจริง') +
        P('ค่าธรรมเนียมจะไม่ถูกเรียกเก็บในคำสั่งซื้อที่ถูกยกเลิก')],
      refund: ['นโยบายคืนเงินและการแก้ปัญหา', () =>
        H('กรณีที่ขอคืนเงินได้') + UL(['หนังสือไม่ตรงกับประกาศ (ชื่อเรื่อง ฉบับพิมพ์ หรือสภาพที่แจ้งไม่ตรง)', 'หนังสือเสียหายเกินกว่าที่ผู้ขายแจ้งไว้', 'ไม่ได้รับสินค้า และข้อมูลขนส่งยืนยันว่าสูญหายหรือไม่เคยส่ง', 'ผู้ขายไม่ส่งของภายในกำหนด 48 ชั่วโมง']) +
        H('กรณีที่ไม่คุ้มครอง') + UL(['เปลี่ยนใจ ไม่อยากได้แล้ว (แนะนำให้นำไปลงขายต่อ)', 'โอนเงินหรือตกลงกันนอกระบบ', 'ตำหนิที่ผู้ขายระบุไว้ในประกาศอยู่แล้ว']) +
        H('หลักฐานที่ต้องมี') + P('ผู้ซื้อควรถ่ายวิดีโอแกะพัสดุแบบไม่ตัดต่อ ตั้งแต่เห็นกล่องภายนอกจนถึงสภาพหนังสือ หากไม่มี การพิจารณาอาจล่าช้าหรือไม่อนุมัติ ผู้ขายต้องมีรูปก่อนแพ็กและใบเสร็จขนส่ง') +
        H('ขั้นตอน') + UL(['แจ้งปัญหาในหน้า "ฝั่งซื้อของฉัน" ก่อนกดยืนยันรับของ', 'ระบบพักเงินไว้ ผู้ขายยังไม่ได้รับเงิน', 'แอดมินตรวจหลักฐานทั้งสองฝ่ายและตัดสิน: คืนเต็มจำนวน คืนบางส่วน หรือปฏิเสธ', 'คืนเงินเข้าบัญชีที่ผู้ซื้อบันทึกไว้ (หรือติดต่อขอเลขบัญชีทางอีเมล)']) +
        H('บทลงโทษผู้ขาย') + P('ส่งของล่าช้าเกิน 48 ชั่วโมงได้รับดาวเตือน ครบ 3 ดวงจะถูกระงับสิทธิ์ขาย 6 เดือน') +
        P('<i class="text-xs text-[#5F7470]">ระยะเวลาโดยละเอียด (เช่น กำหนดวันแจ้งปัญหา) จะประกาศก่อนเปิดใช้งานจริง</i>')],
      terms: ['ข้อกำหนดการใช้งาน', () =>
        H('1. บทบาทของร้าน') + P('ร้านเป็นตัวกลางจัดให้ผู้ซื้อและผู้ขายพบกันและดูแลเงินผ่านบัญชีกลาง ร้านไม่ใช่เจ้าของหนังสือที่ลงขาย') +
        H('2. บัญชีผู้ใช้') + UL(['ให้ข้อมูลจริงและรักษารหัสผ่านของตนเอง', 'ผู้ซื้อต้องยืนยันเบอร์โทรด้วย OTP ก่อนสั่งซื้อ', 'ร้านระงับบัญชีที่พบพฤติกรรมฉ้อโกงหรือละเมิดกติกา']) +
        H('3. ข้อห้าม') + UL(['ลงขายสินค้าละเมิดลิขสิทธิ์ ผิดกฎหมาย หรือไม่ใช่หนังสือ', 'ใช้ภาพหนังสือที่ไม่ใช่ของจริง', 'แลกเปลี่ยนเบอร์โทร ไอดีไลน์ หรือลิงก์ภายนอกเพื่อซื้อขายนอกระบบ', 'สร้างหลายบัญชีเพื่อเลี่ยงกติกาหรือปั่นรีวิว']) +
        H('4. การระงับข้อพิพาท') + P('ร้านตัดสินกรณีพิพาทตามหลักฐานที่ได้รับ ซึ่งไม่กระทบสิทธิตามกฎหมายของทั้งสองฝ่าย') +
        H('5. การเปลี่ยนแปลง') + P('ร้านอาจปรับข้อกำหนดและจะแจ้งบนเว็บไซต์ การใช้งานต่อถือว่ายอมรับ')],
      privacy: ['นโยบายความเป็นส่วนตัว (PDPA)', () =>
        H('ข้อมูลที่เก็บ') + UL(['อีเมล ชื่อที่แสดง เบอร์โทรศัพท์', 'ที่อยู่จัดส่ง (ถ้าคุณกรอก)', 'บัญชีธนาคารสำหรับรับ/คืนเงิน (ถ้าคุณกรอก) — เลขบัญชีเก็บแบบเข้ารหัส แสดงให้เห็นเพียง 4 ตัวท้าย', 'หมวดหมู่หนังสือที่ชอบ และรูปหนังสือที่คุณอัปโหลด']) +
        H('ใช้ข้อมูลเพื่ออะไร') + UL(['ยืนยันตัวตนและจัดการคำสั่งซื้อ-การขาย', 'จัดส่งหนังสือ โอนหรือคืนเงิน', 'ป้องกันการฉ้อโกง', 'แนะนำหนังสือตามหมวดที่คุณเลือก']) +
        H('การเปิดเผย') + P('ชื่อที่แสดงและรหัสผู้ขายเป็นข้อมูลสาธารณะ ที่อยู่และเบอร์โทรจะแสดงเฉพาะคู่ค้าในคำสั่งซื้อที่เกี่ยวข้องเท่านั้น เราไม่ขายข้อมูลให้บุคคลที่สาม') +
        H('ผู้ให้บริการที่เก็บข้อมูล') + P('ข้อมูลเก็บบนบริการคลาวด์ (Supabase สำหรับฐานข้อมูลและยืนยันตัวตน, Cloudflare สำหรับเว็บไซต์) และเมื่อเข้าสู่ระบบด้วย Google เราได้รับเฉพาะชื่อ อีเมล และรูปโปรไฟล์') +
        H('สิทธิของคุณ') + P('คุณขอเข้าถึง แก้ไข หรือลบข้อมูลได้ โดยแก้ที่หน้าโปรไฟล์ หรือติดต่อทีมงานผ่านหน้า <a class="font-bold text-[#26A69A] underline" href="contact.html">ติดต่อเรา</a>')]
    };
    function showPage() {
      const key = (location.hash || '#faq').slice(1);
      const k = PAGES[key] ? key : 'faq';
      document.getElementById('help-tabs').innerHTML = Object.entries(PAGES).map(([id, p]) =>
        `<a href="#${id}" role="tab" aria-selected="${id === k}" class="px-4 py-2 rounded-full border ${id === k ? 'bg-[#26A69A] text-white border-[#26A69A]' : 'bg-white border-[#E6E1D6] hover:bg-[#E0F4F1]'}">${p[0]}</a>`).join('');
      document.getElementById('help-body').innerHTML = `<h1 class="sr-only">${PAGES[k][0]}</h1>` + PAGES[k][1]();
      document.title = PAGES[k][0] + ' | ร้านหนังสือมือสอง';
    }
    window.addEventListener('hashchange', showPage);
    document.addEventListener('DOMContentLoaded', showPage);
  </script>
</body>
</html>
