<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จัดการคำสั่งซื้อ (แอดมิน) | ร้านหนังสือมือสอง</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/tailwind.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#FAF7F2] text-[#1F4E4B]">
  <div id="site-header">
    <header class="sticky top-0 z-50 bg-[#FAF7F2]/95 backdrop-blur-md border-b border-[#E6E1D6]">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
        <a href="index.html" id="navbar-logo-link" data-nav-home="true" onclick="if(window.navigateToHome) return window.navigateToHome(event);" class="flex items-center gap-2 font-extrabold text-base sm:text-lg text-[#1F4E4B] hover:text-[#26A69A] transition cursor-pointer">
          <span class="w-8 h-8 rounded-xl bg-[#E0F4F1] text-[#26A69A] flex items-center justify-center">📚</span>
          <span>ร้านหนังสือมือสอง</span>
        </a>
        <div class="flex items-center gap-2 sm:gap-3">
          <a href="index.html" id="navbar-home-link" data-nav-home="true" onclick="if(window.navigateToHome) return window.navigateToHome(event);" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-[#1F4E4B] hover:bg-[#E0F4F1]/60 hover:text-[#26A69A] text-xs sm:text-sm font-bold transition cursor-pointer">
            <span>หน้าแรก</span>
          </a>
          <a href="login.html" class="inline-flex items-center gap-1.5 px-3.5 sm:px-4 py-2 rounded-full bg-[#26A69A] hover:bg-[#219187] text-white text-xs sm:text-sm font-extrabold shadow-xs transition">
            <span>👤</span>
            <span>เข้าสู่ระบบ<span class="hidden sm:inline"> / สมัครสมาชิก</span></span>
          </a>
        </div>
      </div>
    </header>
  </div>

  <main class="flex-1 py-8 sm:py-12 px-4 sm:px-6">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-2xl sm:text-3xl font-extrabold">จัดการคำสั่งซื้อ (แอดมิน)</h1>
      <p class="text-xs text-[#5F7470] mt-1">ช่วงทดสอบ: "ยืนยันชำระ" ใช้แทนการตรวจเงินเข้าจาก Gateway จริง</p>
      <div class="mt-4 flex flex-wrap gap-2 text-xs font-bold" id="ad-tabs"></div>
      <div id="ad-tools" class="mt-3"></div>
      <div id="ad-list" class="mt-4 space-y-3"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/books-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const STATUS = {
      'Pending Payment': ['รอชำระเงิน', 'bg-[#FDF2E2] text-[#9a5b1b]'],
      'Paid - Awaiting Shipment': ['ชำระแล้ว รอผู้ขายส่งของ', 'bg-[#E0F4F1] text-[#1F4E4B]'],
      'Shipped': ['จัดส่งแล้ว รอผู้ซื้อยืนยัน', 'bg-[#E8EEFB] text-[#2b4a8f]'],
      'Completed & Released': ['เสร็จสิ้น', 'bg-[#E4F5E6] text-[#25683a]'],
      'Disputed - Return Requested': ['แจ้งปัญหา รอแอดมินตัดสิน', 'bg-[#FBE5E3] text-[#9b2c24]'],
      'Returned & Refunded': ['คืนสินค้า/คืนเงินแล้ว', 'bg-[#EEE] text-[#555]'],
      'Cancelled - Refunded': ['ยกเลิกแล้ว', 'bg-[#EEE] text-[#555]']
    };
    const ERR = {
      unauthenticated: 'กรุณาเข้าสู่ระบบ', rate_limited: 'ทำรายการถี่เกินไป กรุณารอสักครู่', invalid_recipient: 'ข้อมูลผู้รับไม่ครบ',
      book_not_found: 'ไม่พบหนังสือเล่มนี้', own_book: 'ซื้อหนังสือของตัวเองไม่ได้', sold_out: 'หนังสือเล่มนี้ขายแล้ว',
      forbidden: 'ไม่มีสิทธิ์ทำรายการนี้', bad_status: 'สถานะคำสั่งซื้อเปลี่ยนไปแล้ว กรุณารีเฟรชหน้า', invalid_tracking: 'เลขพัสดุไม่ถูกต้อง (ตัวอักษร A-Z/ตัวเลข 8-20 ตัว ไม่มีช่องว่าง)',
      need_pack_photo: 'ต้องแนบรูปหนังสือก่อนแพ็ก 1–5 รูป', bad_path: 'ไฟล์หลักฐานไม่ถูกต้อง', reason_too_short: 'กรุณาอธิบายปัญหาอย่างน้อย 10 ตัวอักษร'
    };
    const errText = e => { const m = String((e && e.message) || ''); const k = Object.keys(ERR).find(x => m.includes(x)); return k ? ERR[k] : 'ทำรายการไม่สำเร็จ กรุณาลองใหม่'; };
    const baht = n => '฿' + Number(n || 0).toLocaleString();
    const fmt = d => d ? new Date(d).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
    function statusBadge(s) { const x = STATUS[s] || [s, 'bg-[#EEE]']; return `<span class="px-3 py-1 rounded-full text-[11px] font-bold ${x[1]}">${esc(x[0])}</span>`; }
    function toast(m, ok) { if (typeof showToast === 'function') showToast(m, ok ? 'success' : 'error'); else alert(m); }
    async function signed(sb, path) {
      const { data } = await sb.storage.from('order-evidence').createSignedUrl(path, 300);
      return data && data.signedUrl;
    }
    async function openEvidence(path) {
      const sb = await window.getSupabase(); const u = await signed(sb, path);
      if (u) window.open(u, '_blank', 'noopener'); else toast('เปิดไฟล์ไม่สำเร็จ', false);
    }
    // ย่อรูปก่อนอัปโหลด (ลดขนาด) — วิดีโอส่งตามเดิม
    async function prepareFile(file) {
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
      const bmp = await createImageBitmap(file);
      const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
      return new File([blob], 'p.jpg', { type: 'image/jpeg' });
    }
    async function uploadEvidence(sb, uid, orderId, kind, file) {
      const f = await prepareFile(file);
      const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'video/mp4': 'mp4', 'video/quicktime': 'mov', 'video/webm': 'webm' }[f.type];
      if (!ext) throw new Error('ชนิดไฟล์ไม่รองรับ');
      const path = `${uid}/${orderId}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
      const { error } = await sb.storage.from('order-evidence').upload(path, f, { contentType: f.type, upsert: false });
      if (error) throw error;
      return path;
    }

    const FILTERS = {
      pay: ['รอยืนยันชำระ', o => o.status === 'Pending Payment'],
      ship: ['รอส่งของ', o => o.status === 'Paid - Awaiting Shipment'],
      shipped: ['ส่งแล้ว', o => o.status === 'Shipped'],
      dispute: ['ข้อพิพาท', o => o.status === 'Disputed - Return Requested'],
      payout: ['รอโอนให้ผู้ขาย', o => o.status === 'Completed & Released' && o.payout_status === 'Holding in Escrow'],
      all: ['ทั้งหมด', () => true]
    };
    let sb, tab = 'pay', orders = [], names = {}, banks = {};

    async function load() {
      const { data, error } = await sb.from('orders').select('*').order('created_at', { ascending: false }).limit(300);
      if (error) { document.getElementById('ad-list').innerHTML = '<p class="text-sm">โหลดไม่สำเร็จ</p>'; return; }
      orders = data || [];
      const ids = [...new Set(orders.flatMap(o => [o.buyer_id, o.seller_id]))];
      if (ids.length) {
        const { data: ps } = await sb.from('profiles').select('id, username, seller_no, strike_count').in('id', ids); (ps || []).forEach(p => names[p.id] = p);
        const { data: bs } = await sb.from('seller_bank').select('user_id, bank_name, bank_account_name, bank_account_last4').in('user_id', ids); (bs || []).forEach(b => banks[b.user_id] = b);
      }
      render();
    }
    function render() {
      document.getElementById('ad-tabs').innerHTML = Object.entries(FILTERS).map(([k, f]) => {
        const n = orders.filter(f[1]).length;
        return `<button data-k="${k}" class="px-4 py-2 rounded-full border ${k === tab ? 'bg-[#26A69A] text-white border-[#26A69A]' : 'bg-white border-[#E6E1D6]'}">${f[0]} (${n})</button>`;
      }).join('');
      document.querySelectorAll('#ad-tabs button').forEach(b => b.onclick = () => { tab = b.dataset.k; render(); });
      const list = orders.filter(FILTERS[tab][1]);
      let tools = '';
      if (tab === 'shipped') tools = `<button onclick="releaseOverdue()" class="px-4 py-2 rounded-full border border-[#26A69A] text-xs font-bold">ปล่อยออเดอร์ที่ครบ 7 วันและผู้ซื้อไม่ยืนยัน</button>`;
      if (tab === 'payout' && list.length) {
        const sum = list.reduce((s, o) => s + Number(o.seller_payout), 0);
        tools = `<div class="text-xs mb-2">ยอดรอโอนให้ผู้ขายรวม <b>${baht(sum)}</b> (${list.length} รายการ) — โอนจากบัญชีธนาคารจริงแล้วกด "บันทึกว่าโอนแล้ว" ที่แต่ละรายการ</div>`;
      }
      document.getElementById('ad-tools').innerHTML = tools;
      document.getElementById('ad-list').innerHTML = list.length ? list.map(row).join('') : '<div class="bg-white rounded-3xl border border-[#E6E1D6] p-8 text-center text-sm text-[#5F7470]">ไม่มีรายการ</div>';
    }
    function row(o) {
      const b = names[o.buyer_id] || {}, s = names[o.seller_id] || {}, bk = banks[o.seller_id];
      let act = '';
      if (o.status === 'Pending Payment') act = `<button class="ab" onclick="act('admin_approve_payment',{p_order:${o.id}},'ยืนยันชำระแล้ว')">✅ ยืนยันชำระ (ทดสอบ)</button> <button class="ab-o" onclick="cancelOrder(${o.id})">ยกเลิก</button>`;
      if (o.status === 'Paid - Awaiting Shipment') act = `<span class="text-xs">กำหนดส่ง ${fmt(o.shipping_deadline)}</span> <button class="ab-o" onclick="cancelOrder(${o.id})">ยกเลิก/คืนเงิน${o.shipping_deadline && new Date(o.shipping_deadline) < new Date() ? ' (ล่าช้า → ดาวเตือน)' : ''}</button>`;
      if (o.status === 'Disputed - Return Requested') act = `<button class="ab" onclick="resolve(${o.id}, true)">คืนเงินผู้ซื้อ</button> <button class="ab-o" onclick="resolve(${o.id}, false)">ปฏิเสธ จ่ายผู้ขาย</button>`;
      if (o.status === 'Completed & Released' && o.payout_status === 'Holding in Escrow') act = `<button class="ab" onclick="act('admin_mark_paid_out',{p_ids:[${o.id}]},'บันทึกแล้ว')">💸 บันทึกว่าโอนแล้ว</button> <button class="ab-o" onclick="revealBank('${o.seller_id}', this)">ดูเลขบัญชีเต็ม</button>`;
      const ev = [];
      (o.pack_photo_paths || []).forEach((p, i) => ev.push(`<button class="underline" onclick="openEvidence('${p}')">รูปก่อนแพ็ก ${i + 1}</button>`));
      if (o.receipt_photo_path) ev.push(`<button class="underline" onclick="openEvidence('${o.receipt_photo_path}')">ใบเสร็จขนส่ง</button>`);
      if (o.unboxing_video_path) ev.push(`<button class="underline" onclick="openEvidence('${o.unboxing_video_path}')">วิดีโอแกะพัสดุ</button>`);
      return `<article class="bg-white rounded-2xl border border-[#E6E1D6] p-4 text-xs">
        <div class="flex flex-wrap justify-between gap-2"><div><span class="font-mono">${esc(o.order_code)}</span> · ${fmt(o.created_at)}<div class="font-extrabold text-sm mt-0.5">${esc(o.book_title)}</div></div>${statusBadge(o.status)}</div>
        <div class="mt-1">ผู้ซื้อ <b>${esc(b.username || '-')}</b> → ผู้ขาย <b>${esc(s.username || '-')}</b> (SLR-${String(s.seller_no || 0).padStart(4, '0')}${s.strike_count ? ' ⚠️' + s.strike_count : ''}) · รวม ${baht(o.total_amount)} · จ่ายผู้ขาย ${baht(o.seller_payout)}</div>
        ${o.tracking_no ? `<div class="mt-1">พัสดุ ${esc(o.carrier)} <span class="font-mono">${esc(o.tracking_no)}</span></div>` : ''}
        ${o.dispute_reason ? `<div class="mt-1 text-[#9b2c24]"><b>${esc(o.dispute_category)}:</b> ${esc(o.dispute_reason)}</div>` : ''}
        ${bk && tab === 'payout' ? `<div class="mt-1">บัญชีผู้ขาย: ${esc(bk.bank_name)} ${esc(bk.bank_account_name)} ••••${esc(bk.bank_account_last4)} <span id="bk-${o.seller_id}"></span></div>` : (tab === 'payout' ? '<div class="mt-1 text-[#9b2c24]">ผู้ขายยังไม่ได้ใส่บัญชีรับเงิน</div>' : '')}
        ${ev.length ? `<div class="mt-2 flex flex-wrap gap-3 text-[#26A69A]">${ev.join('')}</div>` : ''}
        ${act ? `<div class="mt-3 flex flex-wrap gap-2 items-center">${act}</div>` : ''}
        ${o.admin_note ? `<div class="mt-1 text-[#5F7470]">หมายเหตุ: ${esc(o.admin_note)}</div>` : ''}
      </article>`;
    }
    async function act(fn, args, ok) {
      try { const { error } = await sb.rpc(fn, args); if (error) throw error; toast(ok, true); await load(); } catch (e) { toast(errText(e), false); }
    }
    function cancelOrder(id) { const n = prompt('เหตุผล/หมายเหตุการยกเลิก (ผู้ใช้จะเห็น)'); if (n === null) return; act('admin_cancel_order', { p_order: id, p_note: n }, 'ยกเลิกแล้ว'); }
    function resolve(id, refund) { const n = prompt('หมายเหตุการตัดสิน (ผู้ใช้จะเห็น)'); if (n === null) return; act('admin_resolve_dispute', { p_order: id, p_refund: refund, p_note: n }, 'บันทึกคำตัดสินแล้ว'); }
    async function releaseOverdue() {
      try { const { data, error } = await sb.rpc('admin_release_unconfirmed'); if (error) throw error; toast(`ปล่อยแล้ว ${data} รายการ`, true); await load(); } catch (e) { toast(errText(e), false); }
    }
    async function revealBank(uidSeller, btn) {
      try { const { data, error } = await sb.rpc('reveal_bank_account', { p_user: uidSeller }); if (error) throw error; btn.parentElement.parentElement.querySelector('[id^="bk-"]').textContent = data || '(ไม่มี)'; } catch (e) { toast(errText(e), false); }
    }
    const style = document.createElement('style');
    style.textContent = '.ab{padding:.5rem 1rem;border-radius:9999px;background:#26A69A;color:#fff;font-weight:800}.ab-o{padding:.5rem 1rem;border-radius:9999px;border:1px solid #E9964A;font-weight:700}';
    document.head.appendChild(style);

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        sb = await window.getSupabase();
        const { data } = await sb.auth.getSession();
        const u = data && data.session && data.session.user;
        if (!u || (u.app_metadata || {}).role !== 'admin') { location.replace('index.html'); return; }
        await load();
      } catch (e) { document.getElementById('ad-list').innerHTML = '<p class="text-sm">เชื่อมต่อระบบไม่สำเร็จ</p>'; }
    });
  </script>
</body>
</html>
