<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ร้านผู้ขาย | ร้านหนังสือมือสอง</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/tailwind.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#FAF7F2] text-[#1F4E4B]">
  <div id="site-header">
    <header class="sticky top-0 z-50 bg-[#FAF7F2]/95 backdrop-blur-md border-b border-[#E6E1D6]">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
        <a href="index.html" id="navbar-logo-link" data-nav-home="true" onclick="if(window.navigateToHome) return window.navigateToHome(event);" class="flex items-center gap-2 font-extrabold text-base sm:text-lg text-[#1F4E4B] hover:text-[#26A69A] transition cursor-pointer">
          <span class="w-8 h-8 rounded-xl bg-[#E0F4F1] text-[#26A69A] flex items-center justify-center">📚</span>
          <span>ร้านหนังสือมือสอง</span>
        </a>
        <div class="flex items-center gap-2 sm:gap-3">
          <a href="index.html" id="navbar-home-link" data-nav-home="true" onclick="if(window.navigateToHome) return window.navigateToHome(event);" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-[#1F4E4B] hover:bg-[#E0F4F1]/60 hover:text-[#26A69A] text-xs sm:text-sm font-bold transition cursor-pointer">
            <span>หน้าแรก</span>
          </a>
          <a href="login.html" class="inline-flex items-center gap-1.5 px-3.5 sm:px-4 py-2 rounded-full bg-[#26A69A] hover:bg-[#219187] text-white text-xs sm:text-sm font-extrabold shadow-xs transition">
            <span>👤</span>
            <span>เข้าสู่ระบบ<span class="hidden sm:inline"> / สมัครสมาชิก</span></span>
          </a>
        </div>
      </div>
    </header>
  </div>

  <main class="flex-1 py-8 sm:py-12 px-4 sm:px-6">
    <div class="max-w-6xl mx-auto">
      <div id="shop-head" class="bg-white rounded-3xl border border-[#E6E1D6] p-6 sm:p-8 shadow-2xs"></div>
      <h2 class="text-lg font-extrabold mt-8 mb-4">หนังสือในร้าน</h2>
      <div id="shop-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/books-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderShop() {
      const id = new URLSearchParams(location.search).get('seller');
      const mine = (window.BOOKS || []).filter(b => String(b.seller_id) === String(id));
      const head = document.getElementById('shop-head'), grid = document.getElementById('shop-grid');
      if (!mine.length) {
        head.innerHTML = '<p class="font-bold">ไม่พบร้านนี้ หรือยังไม่มีหนังสือลงขาย</p><a href="index.html" class="inline-block mt-3 text-[#26A69A] underline text-sm">กลับหน้าแรก</a>';
        grid.innerHTML = ''; return;
      }
      const avail = mine.filter(b => !(b.stock <= 0 || b.stock_status === 'Sold Out'));
      const sold = mine.length - avail.length;
      const f = mine[0]; const rating = Number(f.seller_rating) || 0;
      document.title = `ร้าน ${f.seller_name} | ร้านหนังสือมือสอง`;
      head.innerHTML = `
        <div class="flex flex-wrap items-center gap-4">
          <div class="w-16 h-16 rounded-2xl bg-[#E0F4F1] text-[#26A69A] flex items-center justify-center text-2xl font-black">${esc((f.seller_name || '?').trim().charAt(0))}</div>
          <div>
            <h1 class="text-2xl font-extrabold">${esc(f.seller_name)}</h1>
            <div class="text-xs font-mono text-[#5F7470]">${esc(f.seller_code || '')}</div>
          </div>
          <div class="ml-auto flex gap-5 text-center text-xs font-bold text-[#5F7470]">
            <div><div class="text-lg text-[#E9964A]">★ ${rating ? rating.toFixed(1) : '-'}</div>คะแนน</div>
            <div><div class="text-lg text-[#1F4E4B]">${avail.length}</div>ลงขายอยู่</div>
            <div><div class="text-lg text-[#1F4E4B]">${sold}</div>ขายแล้ว</div>
          </div>
        </div>`;
      grid.innerHTML = [...avail, ...mine.filter(b => !avail.includes(b))].map(b => createBookCardHTML(b)).join('');
    }
    document.addEventListener('DOMContentLoaded', renderShop);
    window.addEventListener('booksLoaded', renderShop);
  </script>
</body>
</html>
