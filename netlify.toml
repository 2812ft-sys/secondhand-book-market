[build]
  publish = "dist"

# รองรับการเปิดหน้าต่างๆ แบบ Clean URL หรือ Multi-page โดยไม่ขึ้น 404
[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/index"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/category"
  to = "/category.html"
  status = 200

[[redirects]]
  from = "/category/*"
  to = "/category.html"
  status = 200

[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 200

[[redirects]]
  from = "/product/*"
  to = "/product.html"
  status = 200

[[redirects]]
  from = "/reviews"
  to = "/reviews.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/forgot-password"
  to = "/forgot-password.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Fallback สำหรับทุกเส้นทางที่ไม่พบไฟล์ ให้ส่งต่อไปยังหน้าหลักโดยไม่เกิด 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
