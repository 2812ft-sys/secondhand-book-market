<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครสมาชิก | ร้านหนังสือมือสอง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#FAF7F2] text-[#1F4E4B]">
  <div id="site-header">
    <header class="sticky top-0 z-50 bg-[#FAF7F2]/95 backdrop-blur-md border-b border-[#E6E1D6]">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
        <a href="index.html" id="navbar-logo-link" data-nav-home="true" onclick="if(window.navigateToHome) return window.navigateToHome(event);" class="flex items-center gap-2 font-extrabold text-base sm:text-lg text-[#1F4E4B] hover:text-[#26A69A] transition cursor-pointer">
          <span class="w-8 h-8 rounded-xl bg-[#E0F4F1] text-[#26A69A] flex items-center justify-center">📚</span>
          <span>ร้านหนังสือมือสอง</span>
        </a>
        <div class="flex items-center gap-2 sm:gap-3">
          <a href="index.html" id="navbar-home-link" data-nav-home="true" onclick="if(window.navigateToHome) return window.navigateToHome(event);" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-[#1F4E4B] hover:bg-[#E0F4F1]/60 hover:text-[#26A69A] text-xs sm:text-sm font-bold transition cursor-pointer">
            <span>หน้าแรก</span>
          </a>
          <a href="login.html" class="inline-flex items-center gap-1.5 px-3.5 sm:px-4 py-2 rounded-full bg-[#26A69A] hover:bg-[#219187] text-white text-xs sm:text-sm font-extrabold shadow-xs transition">
            <span>👤</span>
            <span>เข้าสู่ระบบ / สมัครสมาชิก</span>
          </a>
        </div>
      </div>
    </header>
  </div>

  <main class="flex-1 py-10 sm:py-14 px-4 sm:px-6">
    <div class="max-w-xl mx-auto bg-white rounded-3xl border border-[#E6E1D6] p-6 sm:p-10 shadow-2xs">
      <div class="mb-6">
        <span class="px-3 py-1 rounded-full bg-[#E0F4F1] text-[#26A69A] text-xs font-bold">ลงทะเบียนบัญชีสมาชิก</span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-[#1F4E4B] mt-2">สมัครสมาชิกใหม่</h1>
        <p class="text-xs sm:text-sm text-[#5F7470] mt-1">
          บัญชีเดียวสามารถเป็นได้ทั้งผู้ซื้อ (ซื้อหนังสือ) และผู้ขาย (ลงขายหนังสือของตัวเอง) ได้ทันที
        </p>
      </div>

      <div id="register-alert" class="hidden mb-4 p-3.5 rounded-2xl text-xs font-bold"></div>

      <form id="register-form" onsubmit="handleRegisterSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-[#1F4E4B] mb-1">ชื่อผู้ใช้งาน *</label>
          <input
            required
            type="text"
            id="reg-username"
            placeholder="เช่น คุณกิตติพงศ์ นักอ่าน"
            class="w-full rounded-2xl border border-[#E6E1D6] bg-[#FAF7F2] px-4 py-2.5 text-sm focus:border-[#26A69A] focus:outline-none"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-[#1F4E4B] mb-1">อีเมล *</label>
            <input
              required
              type="email"
              id="reg-email"
              placeholder="เช่น kittipong@email.com"
              class="w-full rounded-2xl border border-[#E6E1D6] bg-[#FAF7F2] px-4 py-2.5 text-sm focus:border-[#26A69A] focus:outline-none"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-[#1F4E4B] mb-1">เบอร์โทรศัพท์ (สำหรับรับรหัส OTP) *</label>
            <input
              required
              type="tel"
              id="reg-phone"
              placeholder="เช่น 081-999-8877"
              class="w-full rounded-2xl border border-[#E6E1D6] bg-[#FAF7F2] px-4 py-2.5 text-sm focus:border-[#26A69A] focus:outline-none"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-[#1F4E4B] mb-1">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร) *</label>
          <input
            required
            type="password"
            minlength="6"
            id="reg-password"
            placeholder="ตั้งรหัสผ่านของคุณ..."
            class="w-full rounded-2xl border border-[#E6E1D6] bg-[#FAF7F2] px-4 py-2.5 text-sm focus:border-[#26A69A] focus:outline-none"
          />
        </div>

        <div class="p-4 rounded-2xl bg-[#FAF7F2] border border-[#E6E1D6] space-y-3">
          <div class="text-xs font-bold text-[#1F4E4B]">🏦 บัญชีธนาคารสำหรับรับเงินเมื่อขายหนังสือได้ (ระบุภายหลังได้)</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input type="text" id="reg-bank-name" placeholder="ชื่อธนาคาร เช่น กสิกรไทย" class="rounded-2xl border border-[#E6E1D6] bg-white px-3.5 py-2 text-xs" />
            <input type="text" id="reg-bank-no" placeholder="เลขที่บัญชี เช่น 123-4-56789-0" class="rounded-2xl border border-[#E6E1D6] bg-white px-3.5 py-2 text-xs font-mono" />
          </div>
        </div>

        <button
          type="submit"
          id="reg-submit-btn"
          class="w-full py-3.5 px-6 rounded-full bg-[#26A69A] hover:bg-[#219187] text-white font-bold text-sm shadow-xs transition cursor-pointer"
        >
          ยืนยันการสมัครสมาชิก
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-[#E6E1D6] flex items-center justify-between text-xs">
        <span class="text-[#5F7470]">มีบัญชีสมาชิกอยู่แล้วใช่ไหม?</span>
        <a href="login.html" class="font-bold text-[#26A69A] hover:underline">เข้าสู่ระบบที่นี่ →</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/books-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone_number = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const bank_name = document.getElementById('reg-bank-name').value.trim();
      const bank_account_no = document.getElementById('reg-bank-no').value.trim();

      const alertBox = document.getElementById('register-alert');
      const btn = document.getElementById('reg-submit-btn');

      btn.disabled = true;
      btn.textContent = 'กำลังบันทึกข้อมูล...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, phone_number, password, bank_name, bank_account_no, bank_account_name: username })
        });
        const data = await res.json();

        if (!res.ok) {
          alertBox.className = 'mb-4 p-3.5 rounded-2xl text-xs font-bold bg-[#FDF2E2] border border-[#E9964A] text-[#1F4E4B]';
          alertBox.textContent = '⚠️ ' + (data.error || 'สมัครสมาชิกไม่สำเร็จ');
          alertBox.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'ยืนยันการสมัครสมาชิก';
          return;
        }

        setAuthSession(data.token, data.user);
        alertBox.className = 'mb-4 p-3.5 rounded-2xl text-xs font-bold bg-[#E0F4F1] border border-[#26A69A] text-[#1F4E4B]';
        alertBox.textContent = `✨ ${data.message}`;
        alertBox.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = data.redirectUrl || 'index.html';
        }, 700);
      } catch (err) {
        alertBox.className = 'mb-4 p-3.5 rounded-2xl text-xs font-bold bg-[#FDF2E2] border border-[#E9964A] text-[#1F4E4B]';
        alertBox.textContent = '⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
        alertBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'ยืนยันการสมัครสมาชิก';
      }
    }
  </script>
</body>
</html>
