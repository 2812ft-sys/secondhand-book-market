<title>ลืมรหัสผ่าน | ร้านหนังสือมือสอง</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/tailwind.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#FAF7F2] text-[#1F4E4B]">
<div id="site-header">
<header class="sticky top-0 z-50 bg-[#FAF7F2]/95 backdrop-blur-md border-b border-[#E6E1D6]">
<div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
<a href="index.html" id="navbar-logo-link" data-nav-home="true" onclick="if(window.navigateToHome) return window.navigateToHome(event);" class="flex items-center gap-2 font-extrabold text-base sm:text-lg text-[#1F4E4B] hover:text-[#26A69A] transition cursor-pointer">
<span class="w-8 h-8 rounded-xl bg-[#E0F4F1] text-[#26A69A] flex items-center justify-center">📚</span>
<span>ร้านหนังสือมือสอง</span>
</a>
<div class="flex items-center gap-2 sm:gap-3">
<a href="index.html" id="navbar-home-link" data-nav-home="true" onclick="if(window.navigateToHome) return window.navigateToHome(event);" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-[#1F4E4B] hover:bg-[#E0F4F1]/60 hover:text-[#26A69A] text-xs sm:text-sm font-bold transition cursor-pointer">
<span>หน้าแรก</span>
</a>
<a href="login.html" class="inline-flex items-center gap-1.5 px-3.5 sm:px-4 py-2 rounded-full bg-[#26A69A] hover:bg-[#219187] text-white text-xs sm:text-sm font-extrabold shadow-xs transition">
<span>👤</span>
<span>เข้าสู่ระบบ<span class="hidden sm:inline"> / สมัครสมาชิก</span></span>
</a>
</div>
</div>
</header>
</div>
<main class="flex-1 py-10 sm:py-14 px-4 sm:px-6">
<div class="max-w-xl mx-auto bg-white rounded-3xl border border-[#E6E1D6] p-6 sm:p-10 shadow-2xs space-y-6">
<div>
<span class="px-3 py-1 rounded-full bg-[#FDF2E2] text-[#E9964A] text-xs font-extrabold">กู้คืนรหัสผ่านบัญชีสมาชิก</span>
<h1 class="text-2xl sm:text-3xl font-extrabold text-[#1F4E4B] mt-2">🔄 ลืมรหัสผ่าน</h1>
<p class="text-xs sm:text-sm text-[#5F7470] mt-1">
          กรอกอีเมลที่ใช้สมัครสมาชิกของคุณเพื่อรับลิงก์ตั้งรหัสผ่านใหม่ทางอีเมล
        </p>
</div>
<div id="forgot-alert" class="hidden p-4 rounded-2xl text-xs"></div>
<form id="forgot-form" onsubmit="handleForgotSubmit(event)" class="space-y-4">
<div>
<label class="block text-xs font-bold text-[#1F4E4B] mb-1">อีเมลที่ใช้สมัครสมาชิก *</label>
<input
            required
            type="email"
            id="forgot-email"
            placeholder="กรอกอีเมลของคุณ เช่น somchai@email.com"
            class="w-full rounded-xl border border-[#E6E1D6] bg-[#FAF7F2] px-4 py-3 text-sm focus:border-[#26A69A] focus:outline-none"
          />
</div>
<button
          type="submit"
          class="w-full py-3.5 px-6 rounded-full bg-[#26A69A] hover:bg-[#219187] text-white font-extrabold text-sm shadow-xs transition cursor-pointer"
        >
          📧 ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่อีเมล
        </button>
</form>
<div id="reset-password-box" class="hidden pt-6 border-t border-[#E6E1D6] space-y-4">
<form onsubmit="handleResetPasswordSubmit(event)" class="space-y-4">
<div>
<label class="block text-xs font-bold text-[#1F4E4B] mb-1">ตั้งรหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร) *</label>
<input required type="password" minlength="8" id="new-password-input" autocomplete="new-password"
              placeholder="กรอกรหัสผ่านใหม่..."
              class="w-full rounded-xl border border-[#E6E1D6] bg-[#FAF7F2] px-4 py-3 text-sm focus:border-[#26A69A] focus:outline-none" />
</div>
<button type="submit" class="w-full py-3.5 px-6 rounded-full bg-[#1F4E4B] hover:bg-[#26A69A] text-white font-extrabold text-sm shadow-xs transition cursor-pointer">
            ✅ บันทึกรหัสผ่านใหม่
          </button>
</form>
</div>
<div class="pt-4 border-t border-[#E6E1D6] flex items-center justify-between text-xs">
<a href="login.html" class="font-bold text-[#5F7470] hover:text-[#26A69A]">← กลับหน้าเข้าสู่ระบบ</a>
<a href="register.html" class="font-bold text-[#26A69A] hover:underline">สมัครสมาชิกใหม่ →</a>
</div>
</div>
</main>
